name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Runtime dependencies (shipped in the built files) must be clean.
      # Build tools are audited too, at critical level: the remaining high advisory (braces, via the
      # single-file plugin) has no upstream fix and only concerns build-time glob patterns.
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit --audit-level=critical
      - run: npm run build # typecheck + 3 builds + public/presentation/lab separation check
